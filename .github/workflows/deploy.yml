name: Deploy Stack

# Manual only. Pushing to main no longer deploys: a deploy is an explicit act
# now that it resolves production credentials from 1Password.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-stack
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Stack
    # The stack is hosted on the Mac mini, so GitHub Actions stays the single
    # deploy surface and the job runs on the mini's self-hosted runner.
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync the deployment checkout
        working-directory: /Users/zknicker/srv/etsysentry
        run: |
          # Move the long-lived deploy checkout to the exact dispatched commit.
          # This discards tracked-file edits on the host that would otherwise
          # make a fast-forward pull fail.
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git reset --hard FETCH_HEAD
          git rev-parse HEAD

      - name: Install dependencies
        working-directory: /Users/zknicker/srv/etsysentry
        env:
          # The deploy agent reads both lifecycle vaults, so the install token
          # resolves through the schema like every other value. Nothing is
          # injected from a platform secret under a canonical name.
          CURSOR_CLOUD_AGENTS_DEVELOPMENT_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: |
          MERCHBASE_GITHUB_NPM_TOKEN="$(ETSYSENTRY_RESOLVE_INSTALL_TOKENS=true \
            bunx varlock@1.16.1 printenv MERCHBASE_GITHUB_NPM_TOKEN)"
          if [ -z "${MERCHBASE_GITHUB_NPM_TOKEN}" ]; then
            echo "MERCHBASE_GITHUB_NPM_TOKEN did not resolve from the Development vault." >&2
            exit 1
          fi
          export MERCHBASE_GITHUB_NPM_TOKEN
          bun install --frozen-lockfile

      - name: Deploy
        working-directory: /Users/zknicker/srv/etsysentry
        env:
          # One identity fills both schema slots: the GitHub deploy agent reads
          # Production for runtime values and Development for the install token
          # the image build needs. The deploy script pins VARLOCK_ENV=production
          # and resolves everything through the schema; no .env file is read,
          # none is written, and no credential is injected under a canonical
          # name.
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
          CURSOR_CLOUD_AGENTS_DEVELOPMENT_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: bun run deploy

      - name: Verify from the consumer
        run: |
          curl --fail --show-error --silent --max-time 20 \
            https://etsysentry.merchbase.co/healthz > /dev/null
          echo "Health endpoint OK."

      - name: Notify Discord
        if: always()
        continue-on-error: true
        uses: merchbaseco/captainhook/.github/actions/deploy-notify@v1
        with:
          discord-webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          job-status: ${{ job.status }}
