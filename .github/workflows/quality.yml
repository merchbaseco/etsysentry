name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      # `bun install` hangs silently and indefinitely when it cannot authenticate
      # to the private @merchbaseco scope, so cap the step rather than let it
      # burn the whole job timeout with no output. If this step times out, the
      # `access` package is missing an Actions-access grant for this repository.
      - name: Install dependencies
        timeout-minutes: 5
        env:
          # Private @merchbaseco/* packages install with the workflow's own
          # repository-scoped token; no 1Password access is involved. CI never
          # holds a vault identity.
          MERCHBASE_GITHUB_NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      # `check` pins the schema's `test` lifecycle itself, so CI needs no
      # environment selector and no 1Password access.
      - name: Run quality gates
        run: bun run check
