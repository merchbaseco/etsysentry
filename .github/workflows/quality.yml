name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      # `bun install` hangs silently and indefinitely when it cannot authenticate
      # to the private @merchbaseco scope, so cap the step rather than let it
      # burn the whole job timeout with no output.
      - name: Install dependencies
        timeout-minutes: 5
        env:
          # Actions' own github.token gets a 403 from GitHub Packages for
          # @merchbaseco/access — a package grants no other repository access by
          # default — so the install credential resolves through the schema like
          # every other value. The deploy agent reads the Development vault,
          # which is where install tokens live.
          CURSOR_CLOUD_AGENTS_DEVELOPMENT_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: |
          MERCHBASE_GITHUB_NPM_TOKEN="$(ETSYSENTRY_RESOLVE_INSTALL_TOKENS=true \
            bunx varlock@1.16.1 printenv MERCHBASE_GITHUB_NPM_TOKEN)"
          if [ -z "${MERCHBASE_GITHUB_NPM_TOKEN}" ]; then
            echo "MERCHBASE_GITHUB_NPM_TOKEN did not resolve from the Development vault." >&2
            exit 1
          fi
          export MERCHBASE_GITHUB_NPM_TOKEN
          bun install --frozen-lockfile

      # `check` pins the schema's `test` lifecycle itself, so the gates need no
      # environment selector and reach no vault: the identity above is scoped to
      # the install step.
      - name: Run quality gates
        run: bun run check
