# Every value is interpolated from the process environment that `varlock run`
# supplies; the schema is the only owner of defaults, so no `${VAR:-default}`
# fallbacks and no `--env-file` appear anywhere in this file.
services:
  postgres:
    image: postgres:16-alpine
    container_name: etsysentry-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5435:5432'
    environment:
      # Postgres' own literal names are required by the image. Values come from
      # the schema so the database and the server cannot drift apart.
      POSTGRES_DB: ${ETSYSENTRY_DATABASE_NAME}
      POSTGRES_USER: ${ETSYSENTRY_DATABASE_USER}
      POSTGRES_PASSWORD: ${ETSYSENTRY_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - etsysentry
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${ETSYSENTRY_DATABASE_USER} -d ${ETSYSENTRY_DATABASE_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  website:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      secrets:
        - github_packages_token
      args:
        VITE_MERCHBASE_CLERK_PUBLISHABLE_KEY: ${VITE_MERCHBASE_CLERK_PUBLISHABLE_KEY}
        VITE_ETSYSENTRY_SERVER_ORIGIN: ${VITE_ETSYSENTRY_SERVER_ORIGIN}
    image: etsysentry-website:local
    container_name: etsysentry-website
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - etsysentry
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  server:
    image: etsysentry-website:local
    container_name: etsysentry-server
    restart: unless-stopped
    command: ['bun', 'run', '--cwd', 'apps/server', 'start']
    environment:
      ETSYSENTRY_PORT: ${ETSYSENTRY_PORT}
      ETSYSENTRY_APP_ORIGIN: ${ETSYSENTRY_APP_ORIGIN}
      MERCHBASE_CLERK_SECRET_KEY: ${MERCHBASE_CLERK_SECRET_KEY}
      MERCHBASE_CLERK_ISSUER: ${MERCHBASE_CLERK_ISSUER}
      MERCHBASE_CLERK_JWT_KEY: ${MERCHBASE_CLERK_JWT_KEY}
      MERCHBASE_CLERK_PUBLISHABLE_KEY: ${MERCHBASE_CLERK_PUBLISHABLE_KEY}
      ETSYSENTRY_CLERK_AUTHORIZED_PARTIES: ${ETSYSENTRY_CLERK_AUTHORIZED_PARTIES}
      ETSYSENTRY_CLERK_WEBHOOK_SIGNING_SECRET: ${ETSYSENTRY_CLERK_WEBHOOK_SIGNING_SECRET}
      ETSYSENTRY_ADMIN_MERCHBASE_USER_ID: ${ETSYSENTRY_ADMIN_MERCHBASE_USER_ID}
      ETSYSENTRY_ETSY_API_KEY: ${ETSYSENTRY_ETSY_API_KEY}
      ETSYSENTRY_ETSY_API_SHARED_SECRET: ${ETSYSENTRY_ETSY_API_SHARED_SECRET}
      ETSYSENTRY_ETSY_OAUTH_REDIRECT_URI: ${ETSYSENTRY_ETSY_OAUTH_REDIRECT_URI}
      ETSYSENTRY_ETSY_OAUTH_SCOPES: ${ETSYSENTRY_ETSY_OAUTH_SCOPES}
      ETSYSENTRY_ETSY_OAUTH_STATE_TTL_MS: ${ETSYSENTRY_ETSY_OAUTH_STATE_TTL_MS}
      ETSYSENTRY_ETSY_OAUTH_REFRESH_SKEW_MS: ${ETSYSENTRY_ETSY_OAUTH_REFRESH_SKEW_MS}
      ETSYSENTRY_ETSY_RATE_LIMIT_DEFAULT_PER_SECOND: ${ETSYSENTRY_ETSY_RATE_LIMIT_DEFAULT_PER_SECOND}
      ETSYSENTRY_ETSY_RATE_LIMIT_DEFAULT_PER_DAY: ${ETSYSENTRY_ETSY_RATE_LIMIT_DEFAULT_PER_DAY}
      ETSYSENTRY_ETSY_RATE_LIMIT_MAX_RETRIES: ${ETSYSENTRY_ETSY_RATE_LIMIT_MAX_RETRIES}
      ETSYSENTRY_ETSY_RATE_LIMIT_BACKOFF_INITIAL_MS: ${ETSYSENTRY_ETSY_RATE_LIMIT_BACKOFF_INITIAL_MS}
      ETSYSENTRY_ETSY_RATE_LIMIT_BACKOFF_MAX_MS: ${ETSYSENTRY_ETSY_RATE_LIMIT_BACKOFF_MAX_MS}
      ETSYSENTRY_ETSY_API_REQUEST_TIMEOUT_MS: ${ETSYSENTRY_ETSY_API_REQUEST_TIMEOUT_MS}
      # The container reaches Postgres over the compose network, so the
      # production arms of these items resolve to the service name and 5432.
      ETSYSENTRY_DATABASE_HOST: ${ETSYSENTRY_DATABASE_HOST}
      ETSYSENTRY_DATABASE_PORT: ${ETSYSENTRY_DATABASE_PORT}
      ETSYSENTRY_DATABASE_NAME: ${ETSYSENTRY_DATABASE_NAME}
      ETSYSENTRY_DATABASE_USER: ${ETSYSENTRY_DATABASE_USER}
      ETSYSENTRY_DATABASE_PASSWORD: ${ETSYSENTRY_DATABASE_PASSWORD}
      ETSYSENTRY_DISABLE_SERVER_JOB_RUNNER: ${ETSYSENTRY_DISABLE_SERVER_JOB_RUNNER}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - etsysentry
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:alpine
    container_name: etsysentry-caddy
    restart: unless-stopped
    ports:
      - '127.0.0.1:8093:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      website:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - etsysentry
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  etsysentry:
    driver: bridge

secrets:
  github_packages_token:
    environment: MERCHBASE_GITHUB_NPM_TOKEN
